name: CI

# Every push: type-check the desktop app and build the dashboard,
# so a broken change shows up here instead of on a worker's computer.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://eacdtfbntkxrpfibblak.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check desktop app
        run: npm run typecheck --workspace agent
      - name: Build dashboard
        run: npm run build --workspace web
