name: Release desktop app

# Builds the Windows installer and publishes it to the PUBLIC releases repo
# (feezyakinwunmi/workforce-releases), where the download page and the
# app's auto-updater find it.
#
# To release: bump "version" in apps/agent/package.json, commit, then
#   git tag agent-v0.1.1 && git push origin agent-v0.1.1
#
# Needs (repo Settings -> Secrets and variables -> Actions):
#   secret   RELEASES_TOKEN  fine-grained token, Contents: read & write on workforce-releases
#   variable DASHBOARD_URL   e.g. https://workforce-xyz.vercel.app
on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/agent/package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "agent-v$version") {
            throw "Tag ${{ github.ref_name }} does not match apps/agent/package.json version $version"
          }

      - name: Build and publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if (-not $env:GH_TOKEN) { throw "Add the RELEASES_TOKEN secret first (see comments at the top of this file)." }
          if (-not $env:DASHBOARD_URL) { throw "Add the DASHBOARD_URL variable first (your Vercel address)." }
          # Build outside the npm workspace so electron-builder packages a plain project.
          $dest = Join-Path $env:RUNNER_TEMP "agent"
          Copy-Item -Recurse apps/agent $dest
          Set-Location $dest
          npm install --no-audit --no-fund
          npm run build
          @{ dashboardUrl = $env:DASHBOARD_URL } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist/build-info.json
          npx electron-builder --win --publish always

      - name: Keep a copy of the installer on this run
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ runner.temp }}/agent/release/*.exe
          if-no-files-found: warn
