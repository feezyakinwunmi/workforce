<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Workbase Meet + Book films</title>
<style>
  @font-face { font-family: "Bricolage"; src: url("file:///home/claude/workforce/apps/web/src/app/fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Inter"; src: url("file:///home/claude/workforce/apps/web/src/app/fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
  :root { --ink: #15123a; --violet: #6a4cf5; --violet-l: #8f7bff; --marigold: #f2a93b; --paper: #f7f6fb; --muted: #b7b2d6; --green: #10b981; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0920; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--paper); overflow: hidden; }
  .d { font-family: "Bricolage", "Inter", sans-serif; letter-spacing: -0.03em; }
  #stage { position: relative; overflow: hidden; }
  .full { position: absolute; inset: 0; }
  #bg { background: radial-gradient(110% 80% at 50% 10%, #2b2275 0%, #15123a 52%, #0a081d 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(130px); opacity: 0.5; }
  #grid { background-image: linear-gradient(rgba(255,255,255,0.045) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.045) 1.5px, transparent 1.5px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(90% 75% at 50% 40%, #000 35%, transparent 100%); }
  #vig { background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.5) 100%); pointer-events: none; }
  .ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* text */
  .kt { position: absolute; font-weight: 800; line-height: 1.02; opacity: 0; }
  .kt .w { display: inline-block; white-space: pre; }
  .kt em { font-style: normal; color: var(--marigold); }
  .kt.sm { font-weight: 700; line-height: 1.12; }

  /* logo */
  #logo { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; }
  #logo svg { width: 230px; height: 230px; }
  #lword { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; opacity: 0; white-space: nowrap; }
  #lword em { font-style: normal; color: var(--marigold); }

  /* generic mock */
  .mock { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; opacity: 0; }
  .shadow { box-shadow: 0 60px 120px -30px rgba(0,0,0,0.75), 0 0 0 2px rgba(255,255,255,0.08); }

  /* phone */
  .phone { width: 418px; height: 872px; border-radius: 64px; border: 14px solid #221c55; background: #f7f6fb; overflow: hidden; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7), 0 0 80px rgba(106,76,245,0.4), inset 0 0 0 2px rgba(255,255,255,0.15); }
  .phone.darkp { background: #0f0d26; }
  .notch { position: absolute; left: 50%; top: 10px; width: 120px; height: 32px; margin-left: -60px; background: #0b0920; border-radius: 16px; z-index: 20; }
  .scr { position: absolute; left: 0; top: 0; width: 390px; height: 844px; padding: 64px 22px 22px; color: var(--ink); opacity: 0; }
  .tap { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(106,76,245,0.25); border: 3px solid rgba(106,76,245,0.85); opacity: 0; z-index: 30; }
  .finger { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(255,255,255,0.92); box-shadow: 0 6px 16px rgba(0,0,0,0.35), 0 0 0 3px rgba(106,76,245,0.6); opacity: 0; z-index: 31; }
  .pnotif { position: absolute; left: 10px; right: 10px; top: 50px; background: rgba(255,255,255,0.98); color: var(--ink); border-radius: 22px; padding: 14px; display: flex; gap: 12px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.45); z-index: 25; opacity: 0; align-items: center; }
  .pnotif .tl { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
  .pnotif b { display: block; font-size: 16px; }
  .pnotif span { font-size: 14px; color: #555077; }

  /* light app bits (Book, dashboard) */
  .card { background: #fff; border: 1px solid #e3e1ee; border-radius: 18px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: var(--violet); color: #fff; font-weight: 600; font-size: 16px; height: 48px; }
  .btn2 { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1.5px solid #cfcbe3; color: #3b3660; font-weight: 600; font-size: 15px; height: 44px; background: #fff; }
  .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; flex-shrink: 0; }
  .lbl { font-size: 13px; color: #6b6690; font-weight: 600; margin-bottom: 6px; }
  .inp { height: 46px; border: 1.5px solid #cfcbe3; border-radius: 11px; display: flex; align-items: center; padding: 0 14px; font-size: 16px; color: var(--ink); background: #fff; margin-bottom: 14px; }
  .inp .cur { display: inline-block; width: 2px; height: 20px; background: var(--violet); margin-left: 1px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; }

  /* calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 15px; }
  .cal .h { font-size: 12px; color: #8a85a8; font-weight: 600; }
  .cal .c { height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #15123a; position: relative; }
  .cal .c.off { color: #c9c5dc; font-weight: 500; }
  .cal .c.on::after { content: ""; position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet); }
  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .times div { height: 42px; border-radius: 11px; border: 1.5px solid var(--violet); color: var(--violet); font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 15px; }

  /* meeting window */
  #mw { width: var(--mww); height: var(--mwh); border-radius: 26px; background: #0f0d26; overflow: hidden; }
  .mtop { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
  .mtop b { font-size: 22px; font-weight: 700; }
  .mtop .code { font-size: 14px; color: #8f8ab5; font-family: ui-monospace, monospace; display: block; margin-top: 2px; }
  .mpill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; background: rgba(255,255,255,0.09); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 22px; }
  .bars i { width: 5px; border-radius: 2px; background: #34d399; display: block; }
  .tile { position: absolute; border-radius: 18px; background: #24204f; overflow: hidden; }
  .tile .tav { position: absolute; left: 50%; top: 46%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 38px "Bricolage", sans-serif; color: #fff; }
  .tile .tnm { position: absolute; left: 16px; bottom: 13px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .tile .tnm .g { font-size: 12px; background: rgba(255,255,255,0.14); border-radius: 6px; padding: 2px 7px; font-weight: 600; }
  .tile .ring { position: absolute; inset: 0; border-radius: 18px; border: 4px solid #34d399; opacity: 0; }
  .tile .tbadge { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; white-space: nowrap; opacity: 0; }
  .tile .dim { position: absolute; inset: 0; background: rgba(10,8,30,0.6); opacity: 0; }
  .tile .hand { position: absolute; left: 14px; top: 14px; width: 40px; height: 40px; border-radius: 12px; background: var(--marigold); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 24px; opacity: 0; }
  .tile .wave2 { position: absolute; left: 50%; top: 46%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 3px solid #34d399; opacity: 0; }
  .mbar { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 14px; }
  .mbar div { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #e8e6f6; }
  .mbar div.on { background: var(--violet); }
  .mbar .leave { width: auto; padding: 0 26px; border-radius: 999px; background: #e5383b; font-weight: 700; font-size: 19px; gap: 8px; }
  .mtoast { position: absolute; left: 50%; top: 86px; transform: translateX(-50%); background: #fff; color: var(--ink); border-radius: 999px; padding: 10px 20px; font-weight: 600; font-size: 18px; display: flex; gap: 10px; align-items: center; opacity: 0; white-space: nowrap; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5); }
  .react { position: absolute; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; opacity: 0; box-shadow: 0 10px 24px rgba(0,0,0,0.35); }
  .share { position: absolute; border-radius: 18px; background: #fff; overflow: hidden; opacity: 0; }

  /* browser (dashboards) */
  .browser { width: 1200px; height: 740px; border-radius: 22px; overflow: hidden; background: #f7f6fb; }
  .chrome { height: 42px; background: #ecebf3; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #dddbe8; }
  .chrome i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .chrome span { margin-left: 18px; background: #fff; border-radius: 8px; height: 26px; width: 460px; font-size: 14px; color: #4a4570; display: flex; align-items: center; padding: 0 12px; gap: 6px; }
  .side { position: absolute; left: 0; top: 42px; bottom: 0; width: 230px; background: #fff; border-right: 1px solid #e3e1ee; padding: 22px 16px; color: #3b3660; }
  .side .it { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px; font-size: 16px; font-weight: 500; }
  .side .it.on { background: #efecff; color: var(--violet); font-weight: 600; }
  .main { position: absolute; left: 230px; right: 0; top: 42px; bottom: 0; padding: 28px 34px; color: var(--ink); }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #efedf6; font-size: 16px; background: #fff; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* app tiles (flow) */
  .appt { position: absolute; width: 300px; height: 300px; border-radius: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 800 40px "Bricolage", sans-serif; color: #fff; opacity: 0; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,255,255,0.12); }
  .appt .ico { font-size: 110px; stroke-width: 1.6; }
  #key { position: absolute; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 800; display: flex; align-items: center; gap: 16px; opacity: 0; box-shadow: 0 30px 60px -10px rgba(0,0,0,0.6); white-space: nowrap; }
  #links { position: absolute; inset: 0; overflow: visible; }

  /* chips + end */
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.14); font-weight: 600; white-space: nowrap; opacity: 0; backdrop-filter: blur(4px); }
  .chip .ico { color: var(--marigold); }
  #end { position: absolute; inset: 0; opacity: 0; }
  #end > div { position: absolute; left: 0; right: 0; text-align: center; }
  .pp { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; font-weight: 800; }
  .conf { position: absolute; width: 14px; height: 22px; border-radius: 4px; opacity: 0; }
  #beam { position: absolute; inset: 0; overflow: visible; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="full"></div>
  <div class="blob" id="b1" style="background:#6a4cf5"></div>
  <div class="blob" id="b2" style="background:#f2a93b"></div>
  <div class="blob" id="b3" style="background:#12968a"></div>
  <div id="grid" class="full"></div>
  <div id="layer" class="full"></div>
  <svg id="beam" width="100%" height="100%"><defs><linearGradient id="bgr" x1="0" x2="1"><stop offset="0" stop-color="#f2a93b"/><stop offset="1" stop-color="#8f7bff"/></linearGradient></defs><path id="beampath" fill="none" stroke="url(#bgr)" stroke-width="8" stroke-linecap="round"/><circle id="beamdot" r="14" fill="#fff" opacity="0"/></svg>
  <div id="logo"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#6A4CF5"/><clipPath id="sc"><rect id="lclip" x="0" y="0" width="48" height="0"/></clipPath><path d="M12 28V17C12 13.4 14.5 11 17.8 11C26 11 33 17.6 36.5 28Z" fill="#fff" clip-path="url(#sc)"/><rect id="lbase" x="9" y="31" width="30" height="6" rx="3" fill="#F2A93B"/></svg></div>
  <div id="lword" class="d"></div>
  <div id="end"></div>
  <div id="vig" class="full"></div>
  <div class="flash" id="flash"></div>
</div>

<script src="icons-data.js"></script>
<script>
// ============================================================ setup
const Q = new URLSearchParams(location.search);
const FILM = Q.get("film") || "meet";
const FORMAT = Q.get("format") || "wide";
const POST = FILM === "post";
const L = FORMAT === "wide";
const W = L ? 1920 : 1080, H = L ? 1080 : POST ? 1350 : 1920;
const DUR = { meet: 21, book: 21, flow: 28, post: 1 }[FILM];
window.DUR = DUR;
const $ = (id) => document.getElementById(id);
const stage = $("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
const layer = $("layer");
const MWW = L || POST ? 1200 : 1000, MWH = L || POST ? 720 : 1240;
stage.style.setProperty('--mww', MWW + 'px'); stage.style.setProperty('--mwh', MWH + 'px');
const ICONS = window.ICONS || {};
const ic = (n, extra = "") => `<svg class="ico" viewBox="0 0 24 24" ${extra}>${ICONS[n] || ""}</svg>`;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, u) => a + (b - a) * u;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = 0.3, fo = 0.3) => Math.min(eo(prog(t, a, fi)), 1 - eio(prog(t, b - fo, fo)));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const S = (el, st) => { for (const k in st) el.style[k] = st[k]; };
const mk = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); const el = d.firstChild; layer.appendChild(el); return el; };

const CUES = [];
const cue = (t, type, d = 0, v = 1) => CUES.push({ t: +t.toFixed(3), type, d, v });

// Place a mock: centre (cx, cy) in stage px, scale s, opacity o, extra lift y.
function place(el, w, h, cx, cy, s, o, rot = 0) {
  S(el, { transform: `translate(${cx - w / 2}px, ${cy - h / 2}px) scale(${s}) rotate(${rot}deg)`, opacity: o });
}

// ============================================================ text
// "Video meetings / built for *Nigerian internet*." → word spans; *x* = marigold.
function makeText(src, size, opts = {}) {
  const el = mk(`<div class="kt d ${opts.sm ? "sm" : ""}"></div>`);
  el.style.fontSize = size + "px";
  el.style.textAlign = opts.align || (L ? "left" : "center");
  const lines = src.split(" / ");
  const words = [];
  el.innerHTML = lines.map((ln) => ln.split(" ").map((w) => {
    const hot = /^\*.*\*[.,!?…]*$/.test(w) || w.startsWith("*") || w.endsWith("*");
    const clean = w.replace(/\*/g, "");
    return `<span class="w">${hot ? `<em>${clean}</em>` : clean}</span>`;
  }).join(" ")).join("<br>");
  // words between *…* spanning several words
  let inside = false;
  el.querySelectorAll(".w").forEach((s, i, all) => words.push(s));
  const raw = src.replace(/ \/ /g, " ").split(" ");
  raw.forEach((w, i) => {
    if (w.startsWith("*")) inside = true;
    if (inside && words[i] && !words[i].querySelector("em")) words[i].innerHTML = `<em>${words[i].textContent}</em>`;
    if (w.replace(/[.,!?…]+$/, "").endsWith("*")) inside = false;
  });
  return { el, words, opts };
}
// Show a text block at (x, y) [x = left edge in wide, centre in tall], words in from t0, out at t1.
function showText(T, t, t0, t1, x, y, stagger = 0.075) {
  const { el, words } = T;
  if (t < t0 - 0.05 || t > t1 + 0.4) { el.style.opacity = 0; return; }
  el.style.opacity = 1;
  const wdt = T.opts.w || (L ? 760 : 960);
  const left = T.opts.center ? W / 2 - wdt / 2 : L ? x : x - wdt / 2;
  S(el, { left: left + "px", top: y + "px", width: wdt + "px" });
  const out = prog(t, t1, 0.35);
  words.forEach((w, i) => {
    const u = prog(t, t0 + i * stagger, 0.45);
    const b = back(u);
    w.style.opacity = clamp(u * 2.2) * (1 - out);
    w.style.transform = `translateY(${(1 - b) * 0.7}em) rotate(${(1 - b) * 5}deg) translateX(${-out * 40}px)`;
    w.style.filter = `blur(${(1 - eo(u)) * 6 + out * 6}px)`;
  });
}

// ============================================================ background + logo
const B1 = $("b1"), B2 = $("b2"), B3 = $("b3");
function bgAt(t) {
  const s = L ? 1 : 1.2;
  S(B1, { width: 900 * s + "px", height: 900 * s + "px", left: (W * 0.18 + Math.sin(t * 0.35) * 120 - 450 * s) + "px", top: (H * 0.2 + Math.cos(t * 0.3) * 90 - 450 * s) + "px" });
  S(B2, { width: 700 * s + "px", height: 700 * s + "px", left: (W * 0.82 + Math.cos(t * 0.28) * 140 - 350 * s) + "px", top: (H * 0.78 + Math.sin(t * 0.33) * 100 - 350 * s) + "px", opacity: 0.32 });
  S(B3, { width: 600 * s + "px", height: 600 * s + "px", left: (W * 0.75 + Math.sin(t * 0.4) * 90 - 300 * s) + "px", top: (H * 0.15 + Math.cos(t * 0.37) * 80 - 300 * s) + "px", opacity: 0.22 });
  $("grid").style.backgroundPosition = `${t * 8}px ${t * 14}px`;
}
const LOGO = $("logo"), LW = $("lword");
function logoAt(t, t0, t1, word) {
  if (t < t0 || t > t1 + 0.5) { LOGO.style.opacity = 0; LW.style.opacity = 0; return; }
  LW.innerHTML = word;
  const u = prog(t, t0, 0.55), out = eio(prog(t, t1, 0.45));
  const y0 = L ? 330 : 700;
  S(LOGO, { top: y0 - out * 60 + "px", opacity: clamp(u * 3) * (1 - out), transform: `scale(${back(u) * (1 - out * 0.2)})` });
  $("lclip").setAttribute("height", 48 * eo(prog(t, t0 + 0.25, 0.5)));
  $("lbase").setAttribute("width", 30 * eo(prog(t, t0 + 0.1, 0.45)));
  const wu = prog(t, t0 + 0.55, 0.5);
  S(LW, { top: y0 + 270 - out * 60 + "px", fontSize: (L ? 120 : 112) + "px", opacity: clamp(wu * 2) * (1 - out), transform: `translateY(${(1 - eo(wu)) * 40}px)`, letterSpacing: `${-0.03 + (1 - eo(wu)) * 0.12}em` });
}

// ============================================================ end card
const END = $("end");
function buildEnd(name, lines, url) {
  END.innerHTML = `
    <div id="eL" style="top:${L ? 210 : 560}px"><svg viewBox="0 0 48 48" style="width:${L ? 150 : 170}px;height:${L ? 150 : 170}px"><rect width="48" height="48" rx="12" fill="#6A4CF5"/><path d="M12 28V17C12 13.4 14.5 11 17.8 11C26 11 33 17.6 36.5 28Z" fill="#fff"/><rect x="9" y="31" width="30" height="6" rx="3" fill="#F2A93B"/></svg></div>
    <div class="d" id="eN" style="top:${L ? 390 : 770}px;font-size:${L ? 110 : 104}px;font-weight:800">${name}</div>
    ${lines.map((l, i) => `<div class="eX" style="top:${(L ? 540 : 930) + i * (L ? 74 : 110)}px;font-size:${L ? 44 : 42}px;padding:0 70px;line-height:1.25;font-weight:600;color:${i === 0 ? "#fff" : "#d9d5f0"}">${l}</div>`).join("")}
    <div id="eU" style="top:${L ? 560 + lines.length * 74 + 30 : 960 + lines.length * 110 + 80}px"><span class="pp" style="font-size:${L ? 40 : 44}px;padding:18px 40px;background:var(--marigold);color:var(--ink)">${url}</span></div>`;
}
function endAt(t, t0) {
  if (t < t0) { END.style.opacity = 0; return; }
  END.style.opacity = 1;
  const parts = [...END.children];
  parts.forEach((p, i) => {
    const u = prog(t, t0 + i * 0.16, 0.55);
    S(p, { opacity: clamp(u * 2), transform: `translateY(${(1 - back(u)) * 50}px) scale(${0.9 + 0.1 * back(u)})` });
  });
}

// screens: [[t, id], ...] → crossfade + slide
function screensAt(ph, list, t) {

  for (let i = 0; i < list.length; i++) if (t >= list[i][0]) cur = i;

// tile rects for n tiles in a 1152 x 528 area at (24, 82)
function tileRects(n) {
  const X = 24, Y = 82, AW = MWW - 48, AH = MWH - 192, g = 16;
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : L || POST ? 3 : 2;
  const rows = Math.ceil(n / cols);
  const w = (AW - g * (cols - 1)) / cols, h = (AH - g * (rows - 1)) / rows;
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const inRow = r === rows - 1 ? n - r * cols : cols;
    const off = (cols - inRow) * (w + g) / 2;
    out.push([X + off + c * (w + g), Y + r * (h + g), w, h]);
  }
  return out;
}
function tilesAt(ids, t, layoutN) {
  ids.forEach((k, i) => {
    const el = $("t_" + k);
    const from = tileRects(layoutN[0])[i], to = tileRects(layoutN[1])[i];
    const u = eio(layoutN[2]);
    const A = from || to, B = to || from;
    if (!A) { el.style.opacity = 0; return; }
    const r = [0, 1, 2, 3].map((j) => lerp(A[j], B[j], u));

  });
}

const CONF = [];
function makeConfetti(n, seed) {

}
function confettiAt(t, t0, cx, cy) {

    if (d < 0 || d > 2.2) { c.el.style.opacity = 0; return; }
    const x = cx + Math.cos(c.a) * c.v * d, y = cy + Math.sin(c.a) * c.v * d * 0.8 + 0.5 * c.g * d * d - 300 * d;

  });
}
function beamAt(t, t0, d, p0, p1) {
  const path = $("beampath"), dot = $("beamdot");
  if (t < t0 || t > t0 + d + 0.6) { path.setAttribute("d", ""); dot.setAttribute("opacity", 0); return; }
  const u = eio(prog(t, t0, d));
  const mx = (p0[0] + p1[0]) / 2, my = Math.min(p0[1], p1[1]) - (L ? 260 : 220);
  const bez = (s) => [(1 - s) ** 2 * p0[0] + 2 * (1 - s) * s * mx + s * s * p1[0], (1 - s) ** 2 * p0[1] + 2 * (1 - s) * s * my + s * s * p1[1]];
  const tail = Math.max(0, u - 0.35);
  let dstr = "";
  for (let i = 0; i <= 24; i++) { const s = lerp(tail, u, i / 24); const [x, y] = bez(s); dstr += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }

  path.setAttribute("opacity", 1 - prog(t, t0 + d, 0.5));

}
