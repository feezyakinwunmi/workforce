<script>
// ============================================================ setup
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get("format") || "wide";
const L = FORMAT === "wide";
const W = L ? 1920 : 1080, H = L ? 1080 : 1920;
const DUR = 62;
const FIT = L ? 0.86 : 0.694;
const AY = L ? 500 : 1075;            // screen y of the camera centre
const CH = 44;                          // browser chrome height
const $ = (id) => document.getElementById(id);
const stage = $("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, u) => a + (b - a) * u;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const ei = (x) => x * x * x;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const elastic = (x) => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
const win = (t, a, b, fi = 0.2, fo = 0.2) => Math.min(eo(prog(t, a, fi)), 1 - eio(prog(t, b - fo, fo)));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (n) => { const r = rng(n * 7919 + 13); return r(); };

// audio cue sheet (read by the sound script)
const CUES = [];
const cue = (t, type, d = 0, v = 1) => CUES.push({ t: +t.toFixed(3), type, d, v });

// ============================================================ data
const BOX = {
  cta: [168, 589, 179, 50], adaeze: [317, 713, 192, 36], issue: [1145, 270, 234, 36], dark: [46, 809, 32, 28],
  nav: { tasks: 447, chat: 409, leave: 523, expenses: 561, timesheets: 255, reviews: 599, team: 715, payroll: 791 },
};
const center = (b) => [b[0] + b[2] / 2, b[1] + b[3] / 2];
const navC = (k) => [118, BOX.nav[k] + 18];

const URLS = { home: "", overview: "/dashboard", activity: "/dashboard/activity", tasks: "/dashboard/tasks", chat: "/dashboard/chat", leave: "/dashboard/leave", expenses: "/dashboard/expenses", timesheets: "/dashboard/timesheets", reviews: "/dashboard/reviews", team: "/dashboard/team", payroll: "/dashboard/payroll", overview_dark: "/dashboard", note_dark: "/dashboard/notes" };

// pages shown in the browser: [time, image, transition, origin]
const PAGES = [
  [10.0, "home", "cut"],
  [12.95, "overview", "cut"],
  [16.95, "activity", "cut"],
];
const MONTAGE = ["tasks", "chat", "leave", "expenses", "timesheets", "reviews", "team", "payroll"];
const MT0 = 20.5;
MONTAGE.forEach((p, i) => PAGES.push([MT0 + i, p, "whip"]));
PAGES.push([34.8, "overview", "whip"]);
PAGES.push([44.25, "overview_dark", "circle", center(BOX.dark)]);
PAGES.push([47.0, "note_dark", "whip"]);

// camera keys: [t, cx, cy, z, {zv, cxv, cyv}]  (browser coords; 720,472 = centre)
const C0 = [720, 472];
const CAM = [
  [0, 720, 472, 1], [10, 720, 472, 1],
  [11.2, 720, 472, 1], [12.3, 520, 480, 1.12, { zv: 1.55, cxv: 470 }],
  [12.5, 520, 480, 1.12, { zv: 1.55, cxv: 470 }], [12.95, 257, 658, 7, { zv: 9, cxv: 257 }],
  [12.951, 850, 260, 1.9, { zv: 2.6, cxv: 700 }, "cut"], [13.6, 720, 472, 1],
  [13.9, 720, 472, 1], [14.6, 850, 209, 1.65, { zv: 2.3, cxv: 640 }],
  [15.2, 850, 209, 1.65, { zv: 2.3, cxv: 640 }], [15.9, 830, 730, 1.45, { zv: 1.9, cxv: 760, cyv: 620 }],
  [16.7, 830, 730, 1.45, { zv: 1.9, cxv: 760, cyv: 620 }], [16.95, 413, 775, 3.2, { zv: 4 }],
  [16.951, 850, 420, 2.2, { zv: 2.8 }, "cut"], [17.5, 850, 414, 1.5, { zv: 2.0, cxv: 680, cyv: 330 }],
  [18.9, 880, 414, 1.55, { zv: 2.05, cxv: 720, cyv: 330 }], [19.4, 1120, 724, 1.9, { zv: 2.5, cxv: 1180, cyv: 620 }],
  [19.9, 1120, 724, 1.9, { zv: 2.5, cxv: 1180, cyv: 620 }], [20.25, 720, 472, 1],
  // montage: beat pulses added in camAt()
  [28.5, 720, 472, 1], [29.2, 850, 209, 1.7, { zv: 2.4, cxv: 600 }],
  [30.5, 860, 209, 1.7, { zv: 2.4, cxv: 640 }], [30.9, 1000, 209, 2.0, { zv: 2.7, cxv: 1000 }],
  [31.3, 1000, 209, 2.0, { zv: 2.7, cxv: 1000 }], [31.7, 760, 420, 1.0, { zv: 1.2, cxv: 900 }],
  [34.8, 760, 420, 1.0, { zv: 1.2, cxv: 900 }],
  [35.0, 720, 472, 1], [35.7, 1180, 472, 0.8, { zv: 0.95, cxv: 720, cyv: 860 }],
  [42.0, 1180, 472, 0.8, { zv: 0.95, cxv: 720, cyv: 860 }], [42.8, 720, 472, 1],
  [45.1, 720, 472, 1], [46.9, 700, 500, 1.14, { zv: 1.5, cxv: 560 }],
  [47.0, 720, 472, 1, {}, "cut"], [47.6, 848, 360, 1.55, { zv: 2.15 }],
  [49.5, 848, 360, 1.65, { zv: 2.3 }], [50.2, 720, 472, 0.6, { zv: 0.6 }],
  [62, 720, 472, 0.6, { zv: 0.6 }],
];
function camAt(t) {
  let i = 0;
  while (i < CAM.length - 1 && CAM[i + 1][0] <= t) i++;
  const a = CAM[i], b = CAM[Math.min(i + 1, CAM.length - 1)];
  const pick = (k) => {
    const o = k[4] || {};
    return L ? [k[1], k[2], k[3]] : [o.cxv ?? k[1], o.cyv ?? k[2], o.zv ?? (k[3] > 1.02 ? k[3] * 1.4 : k[3])];
  };
  const A = pick(a), B = pick(b);
  let u = b === a || b[5] === "cut" ? 0 : eio(prog(t, a[0], b[0] - a[0]));
  if (b[5] === "cut" && t < b[0]) u = 0;
  // zooms feel smoother interpolated in log space
  const z = Math.exp(lerp(Math.log(A[2]), Math.log(B[2]), u));
  let cx = lerp(A[0], B[0], u), cy = lerp(A[1], B[1], u);

    bOp = Math.min(1, prog(t, 10.0, 0.25));
    bT = `perspective(2400px) translateZ(${-2600 * (1 - fin)}px) rotateX(${62 * (1 - fin)}deg) rotateZ(${-8 * (1 - fin)}deg)`;
    // phone scene: turn towards the phone
    const turn = eio(prog(t, 35.0, 0.7)) * (1 - eio(prog(t, 42.0, 0.8)));
    if (turn > 0) bT += ` perspective(2400px) rotateY(${(L ? 16 : 10) * turn}deg)`;
    // wall: the browser flies back into the wall
    const go = eio(prog(t, 49.9, 0.7));
    if (go > 0) { bT += ` translateZ(${-1200 * go}px) rotateX(${30 * go}deg)`; bOp *= 1 - go; }
  }
  S($("browser"), { opacity: bOp, transform: bT });

  // pages
  let pi = -1;
  for (let i = 0; i < PAGES.length; i++) if (t >= PAGES[i][0]) pi = i;
  if (pi >= 0) {
    const [pt, name, tr, origin] = PAGES[pi];
    const prev = pi > 0 ? PAGES[pi - 1][1] : null;
    lastA = setImg(pgA, name, lastA);
    const k = t - pt;
    S(pgA, { transform: "none", filter: "none", opacity: 1, clipPath: "none" });
    pgB.style.opacity = 0;
    if (tr === "whip" && k < 0.24 && prev) {
      const u = eio(k / 0.24);
      lastB = setImg(pgB, prev, lastB);
      S(pgB, { opacity: 1 - u, transform: `translateX(${-u * 700}px) skewX(${u * 8}deg)`, filter: `blur(${u * 18}px)` });
      S(pgA, { transform: `translateX(${(1 - u) * 700}px) skewX(${(1 - u) * 8}deg)`, filter: `blur(${(1 - u) * 18}px)`, opacity: Math.min(1, u * 2) });
    }
    if (tr === "circle" && k < 0.85 && prev) {
      const u = eio(k / 0.85);
      lastB = setImg(pgB, prev, lastB);
      S(pgB, { opacity: 1, transform: "none", filter: "none" });
      pgA.style.clipPath = `circle(${u * 1750}px at ${origin[0]}px ${origin[1]}px)`;
    }
    // address bar
    const dark = name.endsWith("_dark") && (tr !== "circle" || k > 0.4);
    $("chrome").style.background = dark ? "#1c1847" : "#ecebf3";
    $("chrome").style.borderBottomColor = dark ? "#2c2760" : "#dddbe8";
    $("url").style.background = dark ? "#110e33" : "#fff";
    $("url").style.color = dark ? "#b7b2d6" : "#4a4570";
    const host = "phantomire-workforce.vercel.app";
    let txt = host + (URLS[name] ?? "");
    if (name === "home") txt = host.slice(0, Math.floor(clamp((t - 10.4) / 0.032, 0, host.length)));
    $("urltext").innerHTML = `<b>${txt.slice(0, host.length)}</b>${txt.slice(host.length)}`;
    $("caret").style.opacity = name === "home" && t < 11.9 && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
  }

  // highlights + ripples
  for (const h of HLEL) {
    const on = t >= h.t0 && t < h.t1;
    const pulse = 1 + 0.025 * Math.sin((t - h.t0) * 9);
    h.el.style.opacity = on ? win(t, h.t0, h.t1, 0.15, 0.2) : 0;
    h.el.style.transform = `scale(${on ? pulse * (0.94 + 0.06 * eo(prog(t, h.t0, 0.25))) : 1})`;
  }
  for (const r of RIPEL) {
    const p = prog(t, r.t, 0.55);
    r.el.style.opacity = t >= r.t && p < 1 ? 1 - p : 0;
    r.el.style.transform = `scale(${1 + eo(p) * 3.2})`;
  }

  // cursor (screen space)
  let cv = 0;
  for (const [a, b] of CURVIS) if (t >= a && t < b) cv = win(t, a, b, 0.15, 0.2);
  const [ux, uy] = curAt(t);
  const [sx2, sy2] = projVp(ux, uy, c);
  let press = 1;
  for (const [ct] of CLICKS) if (t >= ct - 0.06 && t < ct + 0.16) press = 0.8;
  const cs = L ? 1 : 1.15;
  S($("cursor"), { opacity: cv, transform: `translate(${sx2 - 6}px, ${sy2 - 4}px) scale(${press * cs})` });

  // captions
  for (const cp of CAPEL) {
    const on = t >= cp.t0 - 0.05 && t < cp.t1 + 0.05;
    if (!on) { cp.el.style.opacity = 0; continue; }
    const o = 1 - eio(prog(t, cp.t1 - 0.18, 0.18));
    cp.el.style.opacity = o;
    cp.el.style.transform = `translateX(-50%) translateY(${-eio(prog(t, cp.t1 - 0.18, 0.18)) * 30}px) scale(${0.92 + 0.08 * back(prog(t, cp.t0, 0.3))})`;
    cp.words.forEach((w, i) => {
      const p = prog(t, cp.t0 + i * 0.045, 0.22);
      w.style.opacity = eo(p);
      w.style.transform = `translateY(${(1 - eo(p)) * 28}px)`;
      w.style.filter = `blur(${(1 - eo(p)) * 8}px)`;
    });
  }

  // giant montage words
  for (const g of GEL) {
    const k = t - g.t;
    if (k < 0 || k > 1.0) { g.el.style.opacity = 0; continue; }
    const u = k / 1.0;
    const m = 0.5 + 4 * Math.pow(u - 0.5, 3);       // fast - slow - fast
    const x = lerp(W * 0.9, -W * 0.9, m);
    g.el.style.opacity = Math.min(1, k * 8) * (1 - prog(k, 0.85, 0.15));
    g.el.style.transform = `translate(calc(-50% + ${x}px), -50%) rotate(-6deg)`;
    g.el.querySelector(".f").style.transform = `translate(${12 + 6 * Math.sin(k * 20)}px, 14px)`;
  }

  // vertical header
  $("vhead").style.opacity = !L && t > 10.2 && t < 50 ? win(t, 10.2, 50, 0.4, 0.4) * 0.95 : 0;

  // ---------- payslips fly out (32.1 - 34.6)
  SLIPS.forEach((el, i) => {
    const a = 32.1 + i * 0.15;
    if (t < a || t > 34.8) { el.style.opacity = 0; return; }
    const p = back(prog(t, a, 0.7));
    const gone = ei(prog(t, 33.9 + i * 0.08, 0.6));
    const tx = L ? [-560, 0, 560][i] : [-300, 0, 300][i];
    const ty = L ? [30, -20, 30][i] : [80, -40, 80][i];
    const rz = [-12, 2, 14][i];
    const sc = (L ? 0.62 : 0.55) * (0.25 + 0.75 * eo(prog(t, a, 0.6)));
    const x = W / 2 + tx * p + gone * (L ? 1400 : 900), y = (L ? 470 : 1000) + ty * p - gone * 600;
    el.style.opacity = Math.min(1, prog(t, a, 0.1));
    el.style.transform = `translate(${x - 381}px, ${y - 388}px) perspective(1600px) rotateY(${(1 - p) * 70}deg) rotateZ(${rz * p + gone * 40}deg) scale(${sc})`;
  });

  // ---------- phone (35.2 - 42.8)
  const phIn = eo(prog(t, 35.2, 0.75)), phOut = ei(prog(t, 41.9, 0.7));
  const phOn = t >= 35.2 && t < 42.7;
  const pcx = L ? 1470 : 740, pcy = L ? 540 : 1370, psc = L ? 0.93 : 0.98;
  let shake = 0;
  if (t > 36.3 && t < 38.05) shake = Math.sin(t * 80) * 7 * (0.6 + 0.4 * Math.sin(t * 6));
  const phx = pcx + (1 - phIn) * 700 + phOut * 800 + shake, phy = pcy + (1 - phIn) * 300 + phOut * 200;
  S($("phone"), { opacity: phOn ? 1 : 0, transform: `translate(${phx - 209}px, ${phy - 436}px) rotate(${(1 - phIn) * 25 + phOut * 20 + shake * 0.4}deg) scale(${psc})` });
  const nIn = back(prog(t, 36.2, 0.45)), nOut = eio(prog(t, 38.05, 0.3));
  S($("pnotif"), { opacity: Math.min(1, prog(t, 36.2, 0.15)) * (1 - nOut), transform: `translateY(${-140 * (1 - nIn) - 160 * nOut}px)` });
  const tapP = prog(t, 38.3, 0.45);
  S($("ptap"), { left: "195px", top: "450px", opacity: t >= 38.25 && tapP < 1 ? 1 - tapP : 0, transform: `scale(${0.6 + tapP * 2})` });
  const on2 = t >= 38.45;
  $("ph2").style.opacity = on2 ? Math.min(1, prog(t, 38.45, 0.12)) : 0;
  const secs = Math.max(0, Math.floor(t - 38.45));
  $("patchTimer").textContent = `0:00:${String(secs).padStart(2, "0")}`;
  for (const id of ["patchSince", "patchTimer", "patchToday"]) $(id).style.opacity = $("ph2").style.opacity;
  $("patchToday").textContent = "Today so far: 0h 00m";
  [...$("waves").children].forEach((w, i) => {
    const a = 36.35 + i * 0.4;
    const p = ((t - a) % 1.2) / 1.2;
    const R = 220 + p * 380;
    S(w, { left: phx - R + "px", top: phy - R + "px", width: 2 * R + "px", height: 2 * R + "px", opacity: t > a && t < 38.1 ? (1 - p) * 0.75 : 0 });
  });
  // beam from the phone to Bayo's row
  const bp = prog(t, 38.65, 0.85);
  const beamOn = t >= 38.65 && t < 39.9;
  const A = [phx + (195 - 195) * psc, phy + (450 - 422) * psc];
  const Bp = projVp(560, 853, c);
  const mx = (A[0] + Bp[0]) / 2, my = Math.min(A[1], Bp[1]) - (L ? 260 : 300);
  const qb = (u) => [(1 - u) * (1 - u) * A[0] + 2 * (1 - u) * u * mx + u * u * Bp[0], (1 - u) * (1 - u) * A[1] + 2 * (1 - u) * u * my + u * u * Bp[1]];
  const head = eio(bp), tail = eio(prog(t, 38.9, 0.9));
  let d = "";
  for (let k = 0; k <= 30; k++) { const u = lerp(tail, head, k / 30); const [x, y] = qb(u); d += (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }
  $("beampath").setAttribute("d", d);
  $("beampath").style.opacity = beamOn ? 1 : 0;
  const [dx2, dy2] = qb(head);
  $("beamdot").setAttribute("cx", dx2); $("beamdot").setAttribute("cy", dy2);
  $("beamdot").style.opacity = beamOn && bp < 1 ? 1 : 0;
  $("beamdot").style.filter = "drop-shadow(0 0 18px #f2a93b)";

  // ---------- wall (50 - 62)
  const wallOn = t >= 49.9;
  const wIn = eo(prog(t, 49.9, 0.8));
  const wDim = eio(prog(t, 54.7, 0.6));
  $("wall").style.opacity = wallOn ? wIn * (1 - wDim * 0.82) : 0;
  const scroll = (t - 49.9) * 260;
  const wz = lerp(1.25, 0.82, eio(prog(t, 49.9, 5)));
  $("wallin").style.transform = `translate(-50%, -50%) perspective(2600px) rotateX(${L ? 48 : 40}deg) rotateZ(-24deg) translateY(${-scroll}px) scale(${wz * (L ? 1 : 0.95)})`;
  const ww = WALLWORDS.filter(([a]) => t >= a).pop();
  if (ww && t < 54.75) {
    const k = t - ww[0];
    const last = ww[1] === "ALL IN ONE.";
    $("wword").textContent = ww[1];
    $("wword").style.opacity = 1 - (last ? eio(prog(t, 54.5, 0.25)) : 0);
    $("wword").style.transform = `scale(${1 + 0.35 * Math.exp(-k * 10)}) rotate(${last ? 0 : (hash(Math.floor(ww[0] * 10)) - 0.5) * 8}deg)`;
    $("wword").style.color = last ? "#f2a93b" : "#ffffff";
  } else $("wword").style.opacity = 0;

  // ---------- end card (55 - 62)
  const eOn = t >= 54.95;
  $("end").style.opacity = eOn ? 1 : 0;
  const el = (id, a, dy = 40) => { const p = eo(prog(t, a, 0.55)); S($(id), { opacity: p, transform: `translateY(${(1 - p) * dy}px)` }); };
  const et = back(prog(t, 55.0, 0.7));
  S($("etile"), { opacity: Math.min(1, prog(t, 55.0, 0.15)), transform: `scale(${et}) rotate(${(1 - et) * 120}deg)` });
  el("ebrand", 55.35); el("ename", 55.5, 60); el("etag", 55.9);
  const pp = back(prog(t, 56.4, 0.6));
  S($("eprice"), { opacity: Math.min(1, prog(t, 56.4, 0.2)), transform: `scale(${0.6 + 0.4 * pp})` });
  el("etrial", 56.8); el("eurl", 57.2); el("ebuilt", 57.7, 20);
  // a little click on the URL
  if (t > 58.2 && t < 58.5) $("eurl").style.transform = "scale(0.96)";
  for (const o of CONF) {
    const k = t - 55.0 - o.delay;
    if (k < 0 || k > 4) { o.el.style.opacity = 0; continue; }
    const x = o.x + o.vx * k, y = H + 40 + o.vy * k + 700 * k * k;
    o.el.style.opacity = 1 - prog(k, 3, 1);
    o.el.style.transform = `translate(${x}px, ${y}px) rotate(${o.rot + o.vr * k}deg)`;
  }
}
window.render = render;
window.DURATION = DUR;
render(0);
</script>
</body>
</html>
